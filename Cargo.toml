[package]
name = "refactor"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Production-grade Rust CLI for safe codebase scanning, analysis, refactoring, and migration"
license = "MIT"
repository = "https://github.com/aungpwint/refactor"

[[bin]]
name = "refactor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
walkdir = "2"
ignore = "0.4"
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
blake3 = "1"
console = "0.15"
indicatif = "0.17"
glob = "0.3"
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
